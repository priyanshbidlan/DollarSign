<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#16231d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="$">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#eef1ef;--card:#fff;--ink:#16231d;--mute:#68766f;--line:#d9dfdb;--up:#13804f;--dn:#c23b32;--acc:#16231d;--accT:#fff;--upbg:#dff1e7;--dnbg:#f8e1df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18211c;--ink:#e8efeb;--mute:#8fa097;--line:#2a362f;--up:#3fc58a;--dn:#ef6d63;--acc:#e8efeb;--accT:#0f1512;--upbg:#173026;--dnbg:#3a1f1d}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18211c;--ink:#e8efeb;--mute:#8fa097;--line:#2a362f;--up:#3fc58a;--dn:#ef6d63;--acc:#e8efeb;--accT:#0f1512;--upbg:#173026;--dnbg:#3a1f1d}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 2px 14px}
.logo{font:800 56px/1 Georgia,"Times New Roman",serif}
.bal{text-align:right}.bal small{display:block;color:var(--mute);font-size:13px}.bal b{font-size:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stats small{color:var(--mute);font-size:12px;display:block}.stats b{font-size:18px}
.up{color:var(--up)}.dn{color:var(--dn)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);color:var(--mute);padding:11px;font:inherit;font-weight:600}
.seg button.on.p{background:var(--up);color:#fff}.seg button.on.l{background:var(--dn);color:#fff}
.btn{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--acc);color:var(--accT)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn.del{background:transparent;color:var(--dn);border:1px solid var(--dn);margin-top:8px}
.trade{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.trade:first-child{border-top:0}
.trade .l{min-width:0}.trade .r{text-align:right;white-space:nowrap}
.pair{font-weight:700}.meta{color:var(--mute);font-size:13px}
.desc{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.mis{display:inline-block;margin-top:4px;font-size:13px;background:var(--dnbg);color:var(--dn);border-radius:8px;padding:3px 8px;overflow-wrap:anywhere}
.dayh{font-weight:700;margin:16px 2px 6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:14px 4px}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.bar .n{width:76px;flex:none}.bar .t{flex:1;height:14px;background:var(--bg);border-radius:7px;position:relative;overflow:hidden}
.bar .f{position:absolute;top:0;bottom:0;border-radius:7px}
.bar .v{width:78px;text-align:right;flex:none}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;color:var(--ink)}
.chk input{width:22px;height:22px;flex:none}
.empty{color:var(--mute);text-align:center;padding:28px 10px}
h3{margin:0 0 4px;font-size:17px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <div class="head"><div class="logo">$</div><div class="bal"><small>Account balance</small><b id="bal">0.00</b></div></div>
  <section id="v-journal"></section>
  <section id="v-add" class="hide"></section>
  <section id="v-week" class="hide"></section>
  <section id="v-set" class="hide"></section>
</main>
<nav>
  <button data-v="journal" class="on">Journal</button>
  <button data-v="add">Add trade</button>
  <button data-v="week">Weekly</button>
  <button data-v="set">Settings</button>
</nav>
<script>
var KEY='dollar-journal-v1';
var S={start:0,pairs:['US30','NAS100'],trades:[],weeks:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.trades)S=Object.assign(S,p);}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var money=function(n,sign){var a=Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});return(n<0?'-':(sign&&n>0?'+':''))+'$'+a};
var cls=function(n){return n>0?'up':n<0?'dn':''};
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayName(s){return pd(s).toLocaleDateString(undefined,{weekday:'long'})}
function nice(s){return pd(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function wkStart(s){var d=pd(s);var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)}
function sorted(){return S.trades.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id})}
var view='journal',editId=null,draftSign=1;

function icon(){try{var c=document.createElement('canvas');c.width=c.height=180;var x=c.getContext('2d');x.fillStyle='#16231d';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='bold 130px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('$',90,98);var l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);}catch(e){}}

function go(v){view=v;['journal','add','week','set'].forEach(function(k){$('v-'+k).classList.toggle('hide',k!==v)});
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  if(v!=='add')editId=null;render();window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){go(b.dataset.v)}});

function balances(){var b=+S.start||0,m={};sorted().forEach(function(t){b+=t.pl;m[t.id]=b});return{now:b,by:m}}

function renderJournal(){
  var bl=balances(),all=sorted(),net=all.reduce(function(a,t){return a+t.pl},0),w=all.filter(function(t){return t.pl>0}).length;
  var h='<div class="stats"><div><small>Net P/L</small><b class="'+cls(net)+'">'+money(net,1)+'</b></div><div><small>Trades</small><b>'+all.length+'</b></div><div><small>Win rate</small><b>'+(all.length?Math.round(w/all.length*100):0)+'%</b></div></div>';
  if(!all.length){h+='<div class="card empty">No trades yet. Tap Add trade to log your first one.</div>'}
  else{var cur='',desc=all.slice().reverse();h+='<div class="card">';
    desc.forEach(function(t){
      if(t.date!==cur){cur=t.date;h+='<div class="dayh">'+dayName(t.date)+', '+nice(t.date)+'</div>'}
      h+='<div class="trade" data-id="'+t.id+'"><div class="l"><div class="pair">'+esc(t.pair)+' <span class="meta">· size '+esc(t.size)+'</span></div>'+(t.desc?'<div class="desc">'+esc(t.desc)+'</div>':'')+(t.mistake?'<div class="mis">Mistake: '+esc(t.mistake)+'</div>':'')+'</div><div class="r"><b class="'+cls(t.pl)+'">'+money(t.pl,1)+'</b><div class="meta">'+money(bl.by[t.id])+'</div></div></div>'});
    h+='</div>'}
  var el=$('v-journal');el.innerHTML=h;
  el.querySelectorAll('.trade').forEach(function(e){e.onclick=function(){editId=+e.dataset.id;go('add')}})}

function renderAdd(){
  var t=editId?S.trades.find(function(x){return x.id===editId}):null;
  if(t)draftSign=t.pl<0?-1:1;
  var d=t?t.date:iso(new Date());
  var h='<div class="card"><h3>'+(t?'Edit trade':'New trade')+'</h3>'
  +'<label>Date</label><input type="date" id="f-date" value="'+d+'"><div class="meta" id="f-day" style="margin-top:4px">'+dayName(d)+'</div>'
  +'<label>Pair</label><select id="f-pair">'+S.pairs.map(function(p){return'<option'+(t&&t.pair===p?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'<option value="__new">+ Add another pair</option></select>'
  +'<label>How much was taken (lot size)</label><input id="f-size" type="number" inputmode="decimal" step="any" value="'+(t?esc(t.size):'')+'" placeholder="e.g. 0.5">'
  +'<label>Result</label><div class="seg"><button type="button" class="p '+(draftSign>0?'on':'')+'" id="f-p">Profit</button><button type="button" class="l '+(draftSign<0?'on':'')+'" id="f-l">Loss</button></div>'
  +'<label>Amount ($)</label><input id="f-amt" type="number" inputmode="decimal" step="any" min="0" value="'+(t?Math.abs(t.pl):'')+'" placeholder="0.00">'
  +'<label>Trade description</label><textarea id="f-desc" placeholder="Setup, entry reason, what happened">'+esc(t?t.desc:'')+'</textarea>'
  +'<label>Trade mistake (leave empty if none)</label><textarea id="f-mis" placeholder="What went wrong?">'+esc(t?t.mistake:'')+'</textarea>'
  +'<button class="btn" id="f-save">'+(t?'Save changes':'Save trade')+'</button>'
  +(t?'<button class="btn del" id="f-del">Delete trade</button><button class="btn ghost" id="f-cancel">Cancel</button>':'')+'</div>';
  $('v-add').innerHTML=h;
  $('f-date').onchange=function(){$('f-day').textContent=dayName(this.value||iso(new Date()))};
  $('f-p').onclick=function(){draftSign=1;this.classList.add('on');$('f-l').classList.remove('on')};
  $('f-l').onclick=function(){draftSign=-1;this.classList.add('on');$('f-p').classList.remove('on')};
  var sel=$('f-pair');sel.onchange=function(){if(sel.value==='__new'){var n=(prompt('New pair name')||'').trim().toUpperCase();if(n&&S.pairs.indexOf(n)<0){S.pairs.push(n);save()}
    var keep={date:$('f-date').value,size:$('f-size').value,amt:$('f-amt').value,desc:$('f-desc').value,mis:$('f-mis').value};renderAdd();
    $('f-date').value=keep.date;$('f-size').value=keep.size;$('f-amt').value=keep.amt;$('f-desc').value=keep.desc;$('f-mis').value=keep.mis;
    if(n)$('f-pair').value=n}};
  $('f-save').onclick=function(){
    var amt=parseFloat($('f-amt').value);if(isNaN(amt)){alert('Enter the profit or loss amount.');return}
    var rec={date:$('f-date').value||iso(new Date()),pair:$('f-pair').value==='__new'?S.pairs[0]:$('f-pair').value,size:$('f-size').value,pl:Math.abs(amt)*draftSign,desc:$('f-desc').value.trim(),mistake:$('f-mis').value.trim()};
    if(t){Object.assign(t,rec)}else{rec.id=Date.now();S.trades.push(rec)}
    save();editId=null;go('journal')};
  if(t){$('f-del').onclick=function(){if(confirm('Delete this trade?')){S.trades=S.trades.filter(function(x){return x.id!==t.id});save();editId=null;go('journal')}};$('f-cancel').onclick=function(){editId=null;go('journal')}}}

function renderWeek(){
  var all=sorted();if(!all.length){$('v-week').innerHTML='<div class="card empty">Your weekly review appears here after you add trades.</div>';return}
  var wk={},day={};
  all.forEach(function(t){var k=wkStart(t.date);(wk[k]=wk[k]||[]).push(t);day[t.date]=(day[t.date]||0)+t.pl});
  var keys=Object.keys(wk).sort().reverse();
  var wnet=keys.map(function(k){return wk[k].reduce(function(a,t){return a+t.pl},0)});
  var avgW=wnet.reduce(function(a,b){return a+b},0)/keys.length;
  var dk=Object.keys(day),avgD=dk.reduce(function(a,k){return a+day[k]},0)/dk.length;
  var h='<div class="stats"><div><small>Avg week</small><b class="'+cls(avgW)+'">'+money(avgW,1)+'</b></div><div><small>Avg day</small><b class="'+cls(avgD)+'">'+money(avgD,1)+'</b></div><div><small>Weeks</small><b>'+keys.length+'</b></div></div>';
  keys.forEach(function(k,i){
    var ts=wk[k],net=wnet[i],win=ts.filter(function(t){return t.pl>0}).length,mis=ts.filter(function(t){return t.mistake}).length;
    var end=pd(k);end.setDate(end.getDate()+6);
    var days={};ts.forEach(function(t){days[t.date]=days[t.date]||{pl:0,mis:0};days[t.date].pl+=t.pl;if(t.mistake)days[t.date].mis++});
    var ds=Object.keys(days).sort(),mx=Math.max.apply(null,ds.map(function(d){return Math.abs(days[d].pl)}))||1;
    var rec=S.weeks[k]||{};
    h+='<div class="card"><h3>'+nice(k).replace(/ \d{4}$/,'')+' – '+nice(iso(end))+'</h3>'
    +'<div class="meta">'+ts.length+' trades · win rate '+Math.round(win/ts.length*100)+'% · '+mis+' with mistakes</div>'
    +'<div style="font-size:26px;font-weight:800;margin:6px 0" class="'+cls(net)+'">'+money(net,1)+'</div>'
    +'<div class="meta">vs average week: <span class="'+cls(net-avgW)+'">'+money(net-avgW,1)+'</span></div><div style="margin-top:10px">';
    ds.forEach(function(d){var o=days[d],w=Math.abs(o.pl)/mx*50;
      h+='<div class="bar"><div class="n">'+dayName(d).slice(0,3)+' '+pd(d).getDate()+(o.mis?' <span class="dn">!</span>':'')+'</div><div class="t"><div class="f" style="background:'+(o.pl>=0?'var(--up)':'var(--dn)')+';'+(o.pl>=0?'left:50%':'right:50%')+';width:'+w+'%"></div></div><div class="v '+cls(o.pl)+'">'+money(o.pl,1)+'</div></div>'});
    h+='</div><div class="meta" style="margin-top:4px">Bars compare each day; the centre line is $0. A red ! marks a day with a mistake.</div>'
    +'<label class="chk"><input type="checkbox" data-k="'+k+'" class="wchk"'+(rec.checked?' checked':'')+'>Mistakes reviewed this week</label>'
    +'<label>Weekly notes</label><textarea data-k="'+k+'" class="wnote" placeholder="What did I learn this week?">'+esc(rec.note||'')+'</textarea></div>'});
  var el=$('v-week');el.innerHTML=h;
  el.querySelectorAll('.wchk').forEach(function(c){c.onchange=function(){S.weeks[c.dataset.k]=Object.assign(S.weeks[c.dataset.k]||{},{checked:c.checked});save()}});
  el.querySelectorAll('.wnote').forEach(function(c){c.oninput=function(){S.weeks[c.dataset.k]=Object.assign(S.weeks[c.dataset.k]||{},{note:c.value});save()}})}

function renderSet(){
  $('v-set').innerHTML='<div class="card"><h3>Starting balance</h3><label>Balance before your first logged trade ($)</label><input id="s-start" type="number" inputmode="decimal" step="any" value="'+(S.start||'')+'" placeholder="0.00">'
  +'<button class="btn" id="s-save">Save balance</button></div>'
  +'<div class="card"><h3>Backup</h3><div class="meta">Your trades live in this browser only. Copy a backup now and then.</div>'
  +'<button class="btn ghost" id="s-exp">Copy backup</button><button class="btn ghost" id="s-imp">Restore from backup</button></div>';
  $('s-save').onclick=function(){S.start=parseFloat($('s-start').value)||0;save();go('journal')};
  $('s-exp').onclick=function(){var j=JSON.stringify(S);try{navigator.clipboard.writeText(j).then(function(){alert('Backup copied. Paste it somewhere safe, like a note.')},function(){prompt('Copy this backup:',j)})}catch(e){prompt('Copy this backup:',j)}};
  $('s-imp').onclick=function(){var j=prompt('Paste your backup here');if(!j)return;try{var p=JSON.parse(j);if(!p.trades)throw 0;S=Object.assign({start:0,pairs:['US30','NAS100'],trades:[],weeks:{}},p);save();go('journal')}catch(e){alert('That backup could not be read.')}}}

function render(){
  var b=balances().now;var el=$('bal');el.textContent=money(b);el.className=b>(+S.start||0)?'up':b<(+S.start||0)?'dn':'';
  if(view==='journal')renderJournal();else if(view==='add')renderAdd();else if(view==='week')renderWeek();else renderSet()}
render();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
</script>
</body>
</html>
